version: 2

project_name: knit-statusline

before:
  hooks:
    # -diff report instead of rewrite: goreleaser abort on dirty tree, so tidying
    # hook turn stale go.sum into failed release mid-publish.
    - go mod tidy -diff
    # -race match ci.yml. Weaker check here gate nothing: tag already public.
    - go test -race ./...

builds:
  - id: knit-statusline
    main: ./cmd/statusline
    binary: knit-statusline
    # CGO off: every target cross-compile from one machine, binary carry no
    # runtime dep. Shell predecessor need jq and curl, and missing one fail
    # invisibly inside status line.
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{.Version}}
    # Build time otherwise embedded: one commit build to two different binaries.
    mod_timestamp: "{{ .CommitTimestamp }}"
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    ignore:
      # Claude Code ship no Windows arm64 build.
      - goos: windows
        goarch: arm64

archives:
  - id: default
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    # Version in name: two releases otherwise ship byte-different files under one
    # name, and checksums.txt line name no release.
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    # Archive = go-install-free path: license and config reference travel with
    # binary.
    #
    # mtime pinned per file. Binary carry build mod_timestamp, but these three
    # take checkout time into archive header, so fresh clone of one commit
    # produce different checksums.txt.
    files:
      - src: LICENSE
        info: &archive_mtime
          mtime: "{{ .CommitDate }}"
      - src: README.md
        info: *archive_mtime
      - src: docs/CONFIGURATION.md
        info: *archive_mtime

checksum:
  name_template: checksums.txt

# github-native hand grouping to .github/release.yml. No filters: release.yml
# file docs, test and chore commits under Maintenance.
changelog:
  use: github-native

release:
  # Draft until every npm publish succeed, else release front nonexistent
  # packages.
  draft: true
  prerelease: auto
  # Rerun reach goreleaser again: publish.yml skip npm versions already on
  # registry. GitHub allow many drafts on one tag and match none by tag, so
  # second run otherwise stack draft and `gh release edit <tag>` pick between
  # them. Re-uploaded asset 422 alike.
  replace_existing_draft: true
  replace_existing_artifacts: true
  # Highlights live in annotated tag message, so repository keep no per-release
  # notes file. .TagBody = git %(contents:body): message minus subject and blank
  # line after. Empty on tag carrying only dated marker.
  header: |
    {{- with .TagBody -}}
    ## Highlights

    {{ . }}
    {{- end }}
