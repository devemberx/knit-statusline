version: 2

project_name: knit-statusline

before:
  hooks:
    # -diff report instead of rewriting: goreleaser abort on a dirty tree, so a
    # tidying hook turn a stale go.sum into a failed release mid-publish.
    - go mod tidy -diff
    # -race match ci.yml. Weaker check here gate nothing: tag already public.
    - go test -race ./...

builds:
  - id: knit-statusline
    main: ./cmd/statusline
    binary: knit-statusline
    # CGO off: every target cross-compile from one machine, and binary carry no
    # runtime dep. Shell version this replace need jq and curl, and a status
    # line failing on a machine without them fail invisibly.
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{.Version}}
    # Build time otherwise embedded, so one commit build to two different
    # binaries and nobody reproduce a published checksum.
    mod_timestamp: "{{ .CommitTimestamp }}"
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    ignore:
      # Claude Code ship no Windows arm64 build.
      - goos: windows
        goarch: arm64

archives:
  - id: default
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    # Version in name: without it two releases ship byte-different files under
    # one name, and checksums.txt line name no release it belong to.
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    # Archive = go-install-free path: license and config reference travel with
    # the binary.
    files:
      - LICENSE
      - README.md
      - docs/CONFIGURATION.md

checksum:
  name_template: checksums.txt

# github-native hand grouping to .github/release.yml. No filters: old exclude
# list dropped docs, test and chore commits; release.yml file them under
# Maintenance instead.
changelog:
  use: github-native

release:
  # Draft until every npm publish succeed, else release front nonexistent
  # packages.
  draft: true
  prerelease: auto
  # Draft window is retry path: publish.yml skip npm versions already on
  # registry, so a rerun reach goreleaser again. GitHub allow many drafts on one
  # tag and match none of them by tag, so second run otherwise stack a draft and
  # `gh release edit <tag>` pick between them. Re-uploaded assets 422 alike.
  replace_existing_draft: true
  replace_existing_artifacts: true
  # Highlights live in annotated tag message, so repository keep no per-release
  # notes file. .TagBody = git %(contents:body): message minus subject and the
  # blank line after. Empty on a tag carrying only the dated marker, and then
  # release ship the generated change list alone.
  header: |
    {{- with .TagBody -}}
    ## Highlights

    {{ . }}
    {{- end }}
