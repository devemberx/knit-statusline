version: 2

updates:
  # Action tags go stale in silence -- nothing in CI notice a pin three releases
  # behind. zizmor.yml pin by tag, so this bump tag names, never a repoint.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # A compromised release get yanked within days, and nothing here need the
    # newest action the hour it land.
    cooldown:
      default-days: 7
    # One PR a week for every action, not one per action.
    groups:
      actions:
        patterns: ["*"]
    # scope "deps" is what label-pr.yml map to the dependencies label.
    commit-message:
      prefix: ci
      include: scope

  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    commit-message:
      prefix: chore
      include: scope
