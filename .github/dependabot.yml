version: 2

updates:
  # Action pins go stale in silence -- nothing in CI notice pin three releases
  # behind.
  # Dependabot bump sha and its trailing version comment together.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # Compromised release get yanked within days.
    cooldown:
      default-days: 7
    # One PR a week for all actions, not one per action.
    groups:
      actions:
        patterns: ["*"]
    # prefix ci + include scope give scope "deps", which label-pr.yml map to
    # dependencies label.
    commit-message:
      prefix: ci
      include: scope

  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    commit-message:
      prefix: chore
      include: scope
