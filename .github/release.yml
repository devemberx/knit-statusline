# Group GitHub's generated release notes. GoReleaser delegate here via
# changelog.use: github-native. label-pr.yml stamp the labels from PR titles.
changelog:
  # label-pr.yml never stamp skip-changelog. Maintainer-applied, so it survive
  # a retitle.
  exclude:
    labels:
      - skip-changelog
  categories:
    - title: ⚠ Breaking Changes
      labels:
        - breaking
    - title: 🚀 Features
      labels:
        - feature
    - title: 🐛 Bug Fixes
      labels:
        - bug
    - title: ⚡ Performance
      labels:
        - performance
    - title: ♻ Refactor
      labels:
        - refactor
    - title: 📝 Documentation
      labels:
        - documentation
    - title: ⬆ Dependencies
      labels:
        - dependencies
    - title: 🧰 Maintenance
      labels:
        - "*"
