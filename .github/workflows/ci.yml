name: ci

on:
  push:
    branches: [main]
  pull_request:

# PR push supersede its own stale run. main push never cancel: release tags get
# cut from those commits.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  # go.mod toolchain line newer than setup-go's install make go fetch a third
  # version and test that one -- the pin prove nothing. local fail loudly.
  # https://github.com/actions/setup-go/issues/491
  GOTOOLCHAIN: local

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        # Real runners, not cross-compilation: path handling, file modes and
        # terminal behaviour diverge per OS. Program live in $HOME/.claude on all three.
        include:
          - {os: ubuntu-latest, race: "-race"}
          - {os: macos-latest, race: "-race"}
          # Race detector need a C toolchain on Windows, catch nothing OS-specific.
          - {os: windows-latest, race: ""}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          # go.sum exist since config pull BurntSushi/toml, so setup-go key its
          # module cache off it.
          cache: true

      - run: go test ${{ matrix.race }} ./...

      # Rendered times use the viewer's local zone, so an assertion written
      # against one zone pass only there. bash: windows runner default to pwsh,
      # where VAR=x cmd is a syntax error.
      - name: tests under a second timezone
        shell: bash
        run: TZ=Asia/Seoul go test -count=1 ./...

      # Render path survive whatever arrive on stdin, and never print nothing:
      # empty row indistinguishable from crash. Package tests drive the same
      # cases in-process; this run real binary, so a build that only fail when
      # linked get caught too.
      # Explicit -o suppress .exe Go add on windows, and extension-less PE exec
      # unreliably from Git Bash. mktemp -d give POSIX path; $RUNNER_TEMP is
      # D:\a\_temp, unsafe as bash command word.
      - name: survives hostile input
        shell: bash
        run: |
          bin="$(mktemp -d)/knit-statusline"
          if [ "$RUNNER_OS" = Windows ]; then bin="$bin.exe"; fi
          go build -o "$bin" ./cmd/statusline
          for input in '' '{}' 'null' '[]' 'not json' '{"model":' '{"context_window":{"current_usage":null}}'; do
            if ! out=$(printf '%s' "$input" | NO_COLOR=1 "$bin"); then
              echo "non-zero exit on input: $input"; exit 1
            fi
            if [ -z "$out" ]; then
              echo "empty output on input: $input"; exit 1
            fi
          done

      # Claude Code run statusLine.command through Git Bash on windows, where
      # backslash path lose separators and row stay blank. Run recorded command
      # same way, demand a row, then demand uninstall recognize its own entry.
      # Home names cover both branches: mktemp -d alone never hold a space, so
      # quoted form would ship untested. cygpath: Go want windows home, mktemp
      # hand back POSIX path Git Bash alone map.
      - name: installed command draws a row under the shell
        shell: bash
        run: |
          bin="$(mktemp -d)/knit-statusline"
          if [ "$RUNNER_OS" = Windows ]; then bin="$bin.exe"; fi
          go build -o "$bin" ./cmd/statusline
          for name in plain "John Doe" "O'Brien"; do
            home="$(mktemp -d)/$name"
            mkdir -p "$home"
            if [ "$RUNNER_OS" = Windows ]; then home="$(cygpath -w "$home")"; fi
            HOME="$home" USERPROFILE="$home" "$bin" install
            cmd="$(node -p 'JSON.parse(require("fs").readFileSync(process.argv[1], "utf8")).statusLine.command' "$home/.claude/settings.json")"
            echo "recorded command for [$name]: $cmd"
            if ! out=$(printf '{}' | NO_COLOR=1 bash -c "$cmd"); then
              echo "recorded command failed under bash: $cmd"; exit 1
            fi
            if [ -z "$out" ]; then
              echo "blank row from: $cmd"; exit 1
            fi
            if ! HOME="$home" USERPROFILE="$home" "$bin" uninstall | grep -q "removed the status line"; then
              echo "uninstall did not recognize its own entry: $cmd"; exit 1
            fi
          done

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      # gofmt and go vet run from in here. .golangci.yml hold the full set.
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.12.2

      # Hand-added require, or an orphaned one, show as a dirty tree here rather
      # than a mystery build failure later.
      - name: go.mod stays tidy
        run: |
          go mod tidy
          test -z "$(git status --porcelain --untracked-files=all)" || {
            echo "go mod tidy changed the tree:"; git status --short; exit 1; }

      # Same Node major publish.yml run the staging script under. Runner
      # default Node drift across image updates; skew here test wrong runtime.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      # cli.js run nowhere else: no Go test import it, and install copy the
      # binary to ~/.claude so render never reach the launcher. A syntax error
      # else surface on the first `npx` after publish, and npm reject a reused
      # version. Here, not the test matrix -- parse hold across all three OS.
      - name: npm launcher parses
        run: node --check npm/knit-statusline/bin/cli.js

      # Hermetic staging run against a fake dist: version guards, artifact
      # matching, LICENSE and README copies. publish.yml exercise the script
      # only mid-release, the wrong moment for a first failure.
      # Path explicit, no glob: pattern matching nothing exit 0, and a renamed
      # test file turn this step green with zero tests run.
      - name: npm staging script tests
        run: node --test npm/scripts/prepare-packages.test.mjs

      # Parse only, no snapshot: build matrix already compile every release
      # target. A config typo else surface at tag time, mid-release.
      - name: goreleaser config valid
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          version: "~> v2"
          args: check

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # Mirror the release targets. A tag push is the wrong moment to learn
        # darwin or windows stopped compiling.
        #
        # plan9 and wasip1 ship nowhere and build here to keep !unix build tag
        # honest. internal/segment spell its non-unix open helper !unix, not
        # windows, so a windows-only file landing back there compile on every
        # release target and break these two alone. Both entries, not one: a
        # windows-suffixed file break plan9 and wasip1 together, a plan9-suffixed
        # one break wasip1 while plan9 stay green. No runner exist for either,
        # and none needed: compile is the whole claim.
        #
        # vet typecheck _test.go as well, so unix-only test carry own build tag
        # like caveman_unix_test.go, else these two entries alone go red.
        include:
          - {goos: linux, goarch: amd64}
          - {goos: linux, goarch: arm64}
          - {goos: darwin, goarch: amd64}
          - {goos: darwin, goarch: arm64}
          - {goos: windows, goarch: amd64}
          - {goos: windows, goarch: arm64}
          - {goos: plan9, goarch: amd64}
          - {goos: wasip1, goarch: wasm}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      # vet per GOOS: build-tag guarded code compile nowhere else. ./... cover
      # cmd/statusline too, so release targets get their linker check here.
      - name: cross build
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          go build ./...
          go vet ./...

  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      # Reachability based: a CVE in a required but never called module not fail
      # the build. Database fetched fresh each run, so the pinned tool still see
      # today's advisories.
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.6.0 ./...

      # zizmor.yml relax the hash-pin rule alone. advanced-security off keep this
      # job on contents: read -- findings land as PR annotations, not security tab.
      - uses: zizmorcore/zizmor-action@6fc4b006235f201fdab3722e17240ab420d580e5 # v0.6.1
        with:
          advanced-security: false
          annotations: true
          persona: pedantic
          min-severity: medium
          min-confidence: medium

  # Single required check for branch protection. Jobs and matrix entries change
  # without editing repository settings. skipped count as failure: an `if:` or
  # paths-ignore added to a job else turn the required check green with nothing run.
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: always()
    needs: [test, lint, build, scan]
    steps:
      - if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped') }}
        run: exit 1
      - run: echo "ci green"
