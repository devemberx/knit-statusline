name: publish

on:
  push:
    tags: ["v*"]

# Job inherit what it never asked for otherwise.
permissions: {}

# Cancelled run leave some of seven packages published.
# npm refuse to reuse version even after unpublish.
concurrency:
  group: publish
  cancel-in-progress: false

defaults:
  run:
    # Actions default `bash -e`, no pipefail.
    shell: bash

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Approval gate between tag push and npm.
    # Name must match npm trusted publisher environment -- OIDC claim carry it.
    environment: release
    permissions:
      contents: write # cut GitHub Release
      id-token: write # npm trusted publishing over OIDC
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # checkout leave lightweight tag, wire no refspec for main on tag push.
      - name: fetch annotated tag and main
        run: |
          git fetch --force --tags origin
          git fetch origin +refs/heads/main:refs/remotes/origin/main

      # Tag on side branch build commit nobody reviewed.
      - name: tag sits on main
        run: |
          git merge-base --is-ancestor "${GITHUB_SHA}" origin/main || {
            echo "::error::${GITHUB_REF_NAME} points at a commit not reachable from origin/main"
            exit 1; }

      # .TagBody fall back to commit message body on lightweight tag, so commit
      # bullets ship as ## Highlights on tag already public and unmovable.
      - name: tag is annotated
        run: |
          [ "$(git cat-file -t "${GITHUB_REF_NAME}")" = tag ] || {
            echo "::error::${GITHUB_REF_NAME} is a lightweight tag"
            exit 1; }

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org

      # Trusted publishing need npm >= 11.5.1.
      # Major pinned: unpinned upgrade put every release at mercy of newest npm.
      # npm 12 need node ^22.22.2 || ^24.15.0 || >=26, so node-version above
      # never drop to an earlier 24.x -- EBADENGINE here kill the release.
      - run: npm install -g npm@12

      - name: build and publish GitHub release
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: stage npm packages
        run: node npm/scripts/prepare-packages.mjs "${GITHUB_REF_NAME}" dist

      # Platform packages first: launcher pin them exactly.
      # Skip what already on registry: rerun after failure partway, and npm
      # reject duplicate version forever.
      # Leading ./ load-bearing: npm read bare two-segment path as GitHub
      # shorthand owner/repo.
      # Prerelease take explicit dist-tag: release candidate never on latest.
      - name: publish npm packages
        run: |
          for dir in npm/platforms/*/ npm/knit-statusline; do
            dir="./${dir%/}"
            read -r name version < <(node -p \
              "const j=JSON.parse(require('node:fs').readFileSync('$dir/package.json','utf8')); j.name+' '+j.version")
            case "$version" in *-*) tag=next ;; *) tag=latest ;; esac
            if npm view "$name@$version" version >/dev/null 2>&1; then
              echo "skip $name@$version: already on registry"
              continue
            fi
            echo "publish $name@$version --tag $tag"
            npm publish "$dir" --access public --tag "$tag"
          done

      - name: publish the GitHub release
        run: gh release edit "${GITHUB_REF_NAME}" --draft=false
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
