# zizmor demand a hash for every third-party action. Relaxed to ref-pin: ci.yml
# read as short `uses:` lines instead of 40-char hashes.
#
# Cost is real. A tag is a movable pointer: tj-actions March 2025 repointed every
# version tag at a commit that dumped CI secrets into the build log, and
# hash-pinned consumers never saw it. Dependabot bump tag names, not a tag
# repointed under the same name -- no cover there.
#
# What hold: ci.yml run on contents: read and carry no secret beyond the
# run-scoped GITHUB_TOKEN, and label-pr.yml, the one workflow whose token can
# write, use no third-party action at all. Revisit before publish.yml land --
# that one hold npm publish rights.
rules:
  unpinned-uses:
    config:
      policies:
        "*": ref-pin
