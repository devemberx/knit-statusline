# zizmor's blanket policy demand a hash for every third-party action. Relaxed to
# ref-pin: ci.yml read as ten short `uses:` lines instead of ten 40-char hashes.
#
# The cost is real. A tag is a movable pointer, so an action owner -- or whoever
# take their account -- repoint v9 and the next run fetch it. tj-actions in
# March 2025 rewrote every version tag to a commit that dumped CI secrets into
# the build log; hash-pinned consumers never saw it.
#
# What still hold: dependabot bump these tags weekly, and this repository's
# workflows carry no secret beyond the run-scoped GITHUB_TOKEN. Revisit before
# publish.yml land -- that one hold npm publish rights.
rules:
  unpinned-uses:
    config:
      policies:
        "*": ref-pin
