# hash-pin is zizmor strictest policy.
# Tag is movable pointer: tj-actions March 2025 repointed every version tag at
# commit that dumped CI secrets, hash-pinned consumers unaffected.
# Dependabot bump tag names, not tag repointed under same name -- no cover there.
# Earlier ref-pin relaxation ended at publish.yml: it hold npm publish rights
# over OIDC plus contents: write.
rules:
  unpinned-uses:
    config:
      policies:
        "*": hash-pin
