# knit-statusline -- reference preset
#
# Follows the layout of nilbuild/claude-statusline:
#
#   Opus 4.8 │ ✍️ 42% │ acme (main*) │ ◕ high │ ☑ 3/7
#
#   current ●●●●○○○○○○  42% ⟳ 3:00pm
#   weekly  ●●○○○○○○○○  18% ⟳ jul 28, 3:00pm
#
# Elapsed time is left off: "session" counts wall clock including idle, so the
# number says little about the work done. Add "session" back if you want it.
#
# Each [[lines]] block is one row. Reorder the names, delete one you do not
# want, or move two onto the same row -- that is the whole customisation model.
# Run `knit-statusline preview` after an edit to see the result without
# restarting Claude Code, and `knit-statusline doctor` if something looks wrong.

# "todo" holds the last TodoWrite list this session wrote: ☑ 3/7, green once
# every entry is done. A session that never used the todo tool has no list, so
# the slot is dropped rather than filled with a placeholder -- it appears the
# first time one is written and stays for the rest of the session.
[[lines]]
segments = ["model", "context", "dir", "effort", "todo"]

# A [[lines]] block with no segments is a deliberate blank row. A row whose
# segments all turn out to be empty is dropped instead, so a missing value never
# leaves a stray separator behind.
[[lines]]

[[lines]]
segments = ["limit.5h"]

[[lines]]
segments = ["limit.7d"]

# context, cost, lines, tokens, limit.5h and limit.7d hold their slot from the
# first render: a real zero once the transcript proves the session sent nothing
# yet, "…" while the value is still unknown for any other reason. limit.5h and
# limit.7d skip the zero -- account-wide windows carry on regardless of what
# this session sent, and "session" does the same if you add it back.
# Set unknown = "" to drop the segment instead, or unknown = "?" if your
# terminal draws "…" two columns wide.
[defaults]
unknown = "…"

# Per-segment templates are optional -- every segment has a sensible default.
# These two are spelled out because they show the two things worth knowing:
# {field} interpolation, and a {field:>width} alignment spec.
[segments."limit.5h"]
template = "current {bar} {pct:>3}%{reset}"

[segments."limit.7d"]
template = "weekly  {bar} {pct:>3}%{reset}"
