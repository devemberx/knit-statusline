# knit-statusline -- minimal preset
#
# One row, no subprocess, no file read:
#
#   Opus 4.8 │ ✍️ 42% │ acme
#
# Add "session" for elapsed time.

[[lines]]
segments = ["model", "context", "dir"]

# "dir" default template "{name}{git}" pay git subprocess every render.
# Delete block to restore " (main*)".
[segments.dir]
template = "{name}"
