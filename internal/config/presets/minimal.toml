# knit-statusline -- minimal preset
#
# One row, no subprocess, no file read:
#
#   Opus 4.8 │ ✍️ 42% │ acme
#
# Add "effort" for reasoning level. It reads the transcript when the level is
# xhigh, to tell ultracode from plain xhigh, so the no-file-read line above
# stops holding.

[[lines]]
segments = ["model", "context", "dir"]

# "dir" default template "{name}{git}" pay git subprocess every render.
# Delete block to restore " (main*)".
[segments.dir]
template = "{name}"
